name: Tests
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:

  #####################################################################
  ### Unit Tests ######################################################
  #####################################################################
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: node:24
    timeout-minutes: 60
    steps:

    - name: Retrieving git refs
      uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 50
        lfs: false

    - name: Retrieving cache
      uses: actions/cache@v6
      with:
        path: node_modules/
        key: node-${{ hashFiles('package-lock.json') }}
        restore-keys: node-

    - name: Install NPM dependencies
      run: npm ci

    - name: Run tests
      run: npm test
