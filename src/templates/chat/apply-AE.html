<form class="archmage archmage-apply-ae">
  <div class="form-group">
    <label>{{localize 'ARCHMAGE.CHAT.effect'}}</label>
    <span>{{effectName}}</span>
  </div>
  <div class="form-group">
    <label>{{localize 'ARCHMAGE.CHAT.source'}}</label>
    <span>{{sourceName}}</span>
  </div>
  {{#if ongoing}}
  <div class="form-group">
    <label>{{localize 'ARCHMAGE.ITEM.ongoingDamage'}}</label>
    <label><input type="checkbox" name="ongoingHalf" />{{localize 'ARCHMAGE.CHAT.ongoingHalfDamage'}}</label>
    <label><input type="checkbox" name="ongoingDouble" />{{localize 'ARCHMAGE.CHAT.ongoingDoubleDamage'}}</label>
    <label><input type="checkbox" name="ongoingTriple" />{{localize 'ARCHMAGE.CHAT.ongoingTripleDamage'}}</label>
  </div>
  {{/if}}
  <div class="form-group">
    <label style="align-self: start;">{{localize 'ARCHMAGE.CHAT.duration'}}</label>
    <div class="form-fields" style="flex-direction: column; align-items: start;">
      {{#if defaultDuration}}
      {{radioBoxes 'duration' durations checked=defaultDuration localize=true}}
      {{else}}
      {{radioBoxes 'duration' durations localize=true}}
      {{/if}}
    </div>
  </div>
  <div class="form-group save-dc">
    <label>{{localize 'ARCHMAGE.SAVE.dc'}}</label>
    <input type="number" name="saveDC" value="{{saveDC}}" min="1" step="1" placeholder="{{localize 'ARCHMAGE.SAVE.dcHint'}}" />
  </div>
</form>
