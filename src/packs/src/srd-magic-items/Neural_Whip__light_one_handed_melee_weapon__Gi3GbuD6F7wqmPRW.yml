    label: Description
    value: >-
      <p>A tentacle snakes one end around your arm, inserting filaments beneath
      the skin. The whip stretches and flexes at your mental command, the tip
      studded with hardened pulsing nerves.</p>

      <p>Always: Bonus to attacks and damage: +1 (adventurer); +2 (champion); +3
      (epic).</p>

      <p>2/battle: You can use a reach trick with the whip (13th Age core book,
      page 44), and the attack deals psychic damage.</p>

      <p>Quirk: Grows eyes in unusual places.</p>
