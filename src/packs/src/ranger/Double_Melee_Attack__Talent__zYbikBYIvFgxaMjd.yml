  effect:
    label: Effect
    type: String
    value: <p>When fighting with two one-handed melee weapons, your default option
      is to make a double melee attack.</p><p>Your weapon damage die drops one notch,
      usually from d8s to d6s. If your first attack is a natural even roll (hit or
      miss), you can make a second attack as a free action.</p><p>If you decide you
      don't want to try for a double melee attack while fighting with two one-handed
      weapons, declare it before rolling your attack; the single attack will deal
      the normal damage dice instead of using reduced damage dice.</p>
  embeddedMacro:
    label: Embedded Macro
    type: String
    value: ''
