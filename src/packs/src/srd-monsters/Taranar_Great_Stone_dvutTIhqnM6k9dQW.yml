  - _id: p1XmmYXrN1o5imJO
    effects: []
    flags: {}
    folder: null
    img: icons/svg/poison.svg
    name: Blade breaker
    ownership:
      default: 0
    sort: 0
    system:
      name:
        type: String
        label: Name
      description:
        type: String
        label: Description
        value: >-
          <p>Once per battle when a melee weapon attack hits the taranar and is
          not a crit, the attack does half damage and the weapon breaks.
          Wielders of magical weapons have a choice between dealing no damage
          but their weapon staying intact, or dealing normal damage but their
          weapon shatters and deals [[2d10]] force damage to both them and the
          taranar.</p>
      embeddedMacro:
        type: String
        label: Embedded Macro
        value: ''
