  - _id: VVcYa052I4aUGwkE
    effects: []
    flags: {}
    folder: null
    img: icons/svg/regen.svg
    name: Trog stench
    ownership:
      default: 0
    sort: 0
    system:
      name:
        type: String
        label: Name
      description:
        type: String
        label: Description
        value: >-
          <p>Trogs spray scents that stink so badly that other humanoids take
          penalties to all attacks, defenses, and saves when engaged with a
          troglodyte or when nearby three or more troglodytes. Non-humanoids
          aren&rsquo;t affected.</p>

          <p>Humanoids affected by trog stench can make a normal save (with a
          penalty) at the end of each of their turns. If the save succeeds, the
          humanoid can ignore all trog stench for the rest of the battle. Trog
          stench penalties vary for different humanoid races:</p>

          <table border="1">

          <tbody>

          <tr>

          <td>Race</td>

          <td>Save Penalty</td>

          </tr>

          <tr>

          <td>Elves, gnolls, gnomes</td>

          <td>-4</td>

          </tr>

          <tr>

          <td>Humans, halflings, half-elves, Aasimar, tieflings, etc.</td>

          <td>-3</td>

          </tr>

          <tr>

          <td>Half-orcs, draconics</td>

          <td>-2</td>

          </tr>

          <tr>

          <td>Dwarves</td>

          <td>-1</td>

          </tr>

          <tr>

          <td>Steelforged</td>

          <td>-0</td>

          </tr>

          </tbody>

          </table>

          <p>&nbsp;</p>
      embeddedMacro:
        type: String
        label: Embedded Macro
        value: ''
      group:
        type: String
        label: Group
        value: ''
    type: trait
