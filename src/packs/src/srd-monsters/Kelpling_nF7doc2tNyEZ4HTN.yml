    system:
      name:
        type: String
        label: Name
      description:
        type: String
        label: Description
        value: >-
          <p>The first time the kelpling is staggered during a fight, various
          bladders and blebs on its component symbionts rupture in self-defense,
          causing [[4]] acid damage plus [[2]] ongoing acid damage to all nearby
          enemies (normal save ends). The kelpling can then perform its
          <em>stings a bit</em> attack as a free action on the creature it is
          engaged with.</p>
      embeddedMacro:
        type: String
