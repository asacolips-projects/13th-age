    img: icons/svg/mystery-man.svg
    name: Three heads are better than one
    ownership:
      default: 0
    sort: 800000
    system:
      name:
        type: String
        label: Name
      description:
        type: ''
        label: Description
        value: >-
          The empyrean dragon can make two gleaming bite attacks as a single
          standard action, one each from two heads. The third head is assumed to
          be maneuvering the body around. It can choose not to make one of those
          attacks to end any condition affecting it except for ongoing damage
          (this includes the *stunned* condition, even though it technically
          doesn’t get an action when stunned).
      embeddedMacro:
        type: String
        label: Embedded Macro
        value: ''
