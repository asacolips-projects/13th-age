  - _id: ifzyMvtsTrYZDyTr
    effects: []
    flags: {}
    folder: null
    img: icons/svg/mystery-man.svg
    name: >-
      An enemy who scores a critical hit against an empyrean dragon can forego
      the extra damage to lop off one of the dragon’s heads. If an enemy deals
      [[150]] damage with a single attack against the dragon, the attack will
      also remove a head. An empyrean dragon with two remaining heads can make
      only one gleaming bite attack as a standard action and can’t sacrifice
      that attack to remove conditions. The dragon dies if all three heads are
      removed.
