        type: String
        label: Description
        value: >-
          <p>The Fallen Icon has resist damage 16+ to attacks not made with
          epic-tier magical weapons, implements, or bracers. Enemies not wearing
          epic-tier magical armor are vulnerable to its hammer of golden
          sovereignty attacks (that&rsquo;s right&mdash;eschewing magic items
          makes it easier to defeat the minions of the Fallen Icon, but harder
          to beat the Fallen Icon itself).</p>
