  - _id: dBoeCucSWKuD7WKU
    effects: []
    flags: {}
    folder: null
    img: icons/svg/regen.svg
    name: Fallen icon
    ownership:
      default: 0
    sort: 0
    system:
      name:
        type: String
        label: Name
      description:
        type: String
        label: Description
        value: >-
          <p>The Fallen Icon is no longer an icon, but it still possesses
          magical bonds with reality that make it difficult to destroy. See the
          flavor text at the top of the Fallen Icon&rsquo;s stat block for ways
          in which significant campaign victories can make the Fallen Icon
          easier to defeat. (To be clear: if the PCs don&rsquo;t achieve any of
          these campaign victories, the Fallen Icon will be difficult or perhaps
          even impossible to destroy.)</p>
      embeddedMacro:
        type: String
