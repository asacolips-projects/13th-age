          biting) or an ally (with a basic attack) to 0 hp or lower, that
          creature also begins making last gasp saves. Failing the fourth last
          gasp save turns the creature into a raving cannibal; it loses all its
          normal abilities and becomes an NPC until the PCs find a way to
          restore their ally (at GM’s discretion).
