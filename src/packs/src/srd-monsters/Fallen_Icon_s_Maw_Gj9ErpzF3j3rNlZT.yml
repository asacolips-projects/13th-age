      description:
        type: String
        label: Description
        value: >-
          <p>If the Fallen Icon&rsquo;s Maw is slain, the GM secretly rolls a
          normal save (11+) at the end of each session, including this one. If
          the save succeeds, the Fallen Icon regains a semblance of life: the
          Fallen Icon&rsquo;s Shadow, the 13th level creature statted just
          below, returns to life with attendant high priests and mages. If the
          campaign somehow ends while the Fallen Icon&rsquo;s Maw and Fallen
          Icon&rsquo;s Shadow are dead, well, it&rsquo;s not really dead, is
          it?</p>
