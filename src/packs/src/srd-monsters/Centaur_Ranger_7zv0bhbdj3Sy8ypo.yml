        label: Name
      description:
        type: ''
        label: Description
        value: >-
          Once each round when the escalation die is odd, the centaur ranger can
          make use of the area’s terrain to its advantage as a free action. It
          can choose either to gain a +2 attack bonus for its attacks that turn,
          or to gain a +2 bonus to all defenses against the next attack that
          targets it by using a flashy or tricky maneuver (leaping off a rock
          over an enemy, stirring up a hornet’s nest near an attacker, etc.).
          The target of its attack or a creature attacking it when it attempts
          this stunt rolls a normal save; on a success, the bonus is negated.
