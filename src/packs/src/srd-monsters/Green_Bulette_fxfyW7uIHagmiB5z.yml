        type: String
        label: Name
      description:
        type: ''
        label: Description
        value: >-
          The first time each round an attack hits the bulette, it can choose to
          hunker down as a free action. If it does, it gains a +3 bonus to AC
          and PD until the start of its next turn. Force attacks and opportunity
          attacks don’t trigger this ability. If the green bulette hunkers down
          while it’s moving (for example, from a readied action), its movement
          ends that turn.
