        type: String
        label: Name
      description:
        type: ''
        label: Description
        value: >-
          Before rolling a save for a magic item, a PC can gain a +5 bonus to
          the save by agreeing to roleplay the item’s quirk as a huge element of
          their personality until the next full heal-up. Failure to live up to
          this roleplaying agreement means that the item hasn’t received the
          support it needs from its owner to survive the rust monster’s
          destructive effects, and the item is destroyed at the end of the next
          battle even if its owner successfully saved.
      embeddedMacro:
        type: String
