      effect:
        type: String
        label: Effect
        value: >-
          <p>At the start of each of your turns, roll a die to see if you get an
          extra standard action. If your roll is equal to or lower than the
          escalation die [[@ed]], you get an extra standard action that
          turn.</p><p>At the start of battle, you roll a d6. Each time you
          successfully gain an extra action, the size of the die you roll
          increases by one step on the following progression: (d4) [[1d4]], d6
          [[1d6]], d8 [[1d8]], d10 [[1d10]], d12 [[1d12]], d20 [[1d20]]. If you
          get an extra action after rolling a d20, you can’t get any more extra
          actions that battle.</p>
